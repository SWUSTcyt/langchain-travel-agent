<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>旅游助手界面原型 v0.4</title>
  <style>
    :root {
      --sky: #e8f6ff;
      --ink: #143047;
      --muted: #5d7386;
      --line: #d5e6f2;
      --sea: #0b7ea8;
      --sun: #f4b000;
      --card: #ffffff;
      --fail: #c2412d;
      --fail-soft: #fff1ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(900px 280px at 10% -10%, #fff6d8 0%, transparent 60%),
        linear-gradient(#f7fbfe, var(--sky));
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .review {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.86);
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
    }
    .review b { color: var(--ink); }
    .states { display: flex; gap: 6px; }
    button, input { font: inherit; }
    .states button, .textish {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .states button[aria-pressed="true"] { background: var(--sea); color: white; }
    .app { width: min(1080px, calc(100% - 28px)); margin: 18px auto 28px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .top h1 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
    .top p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .workspace { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start; }
    .side, .main, .dock { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
    .side { padding: 16px; }
    .side h2 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 650; }
    .side strong { display: block; font-size: 22px; letter-spacing: -0.03em; }
    .side span { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; }
    .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .facts i { font-style: normal; background: #e7f6fd; color: var(--sea); border-radius: 999px; padding: 4px 8px; font-size: 12px; }
    .main { padding: 16px; min-height: 420px; }
    .places { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .place { border: 0; text-align: left; border-radius: 16px; min-height: 168px; padding: 14px; cursor: pointer; color: #143047; }
    .place b { display: block; font-size: 20px; margin-bottom: 6px; }
    .place span { font-size: 13px; }
    .place.cd { background: linear-gradient(160deg, #ffe7c2, #fff); }
    .place.hz { background: linear-gradient(160deg, #d7f3ff, #fff); }
    .place.bj { background: linear-gradient(160deg, #ffe1d6, #fff); }
    .ask { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .ask b { color: var(--ink); }
    .weather { display: flex; justify-content: space-between; background: #e9f8ef; color: #176b45; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
    .days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .day { border-radius: 14px; padding: 12px; min-height: 160px; }
    .day small { font-size: 12px; letter-spacing: 0.06em; }
    .day h3 { margin: 6px 0; font-size: 18px; }
    .day p { margin: 0; font-size: 14px; }
    .d1 { background: #fff4df; }
    .d2 { background: #e7f7ff; }
    .d3 { background: #eefbf3; }
    .fail { background: var(--fail-soft); border-radius: 14px; padding: 16px; }
    .fail h3 { margin: 0 0 6px; color: var(--fail); }
    .fail p { margin: 0; }
    .bar { height: 12px; border-radius: 999px; margin: 10px 0; background: linear-gradient(90deg, #e7f3fb, #fff, #e7f3fb); background-size: 200% 100%; animation: shine 1.1s linear infinite; }
    .bar.short { width: 42%; }
    @keyframes shine { to { background-position: -200% 0; } }
    details { margin-top: 12px; color: var(--muted); font-size: 14px; }
    .dock { display: flex; gap: 8px; margin-top: 12px; padding: 8px; }
    .dock input { flex: 1; border: 0; padding: 12px 14px; border-radius: 12px; background: #f4f9fc; color: var(--ink); }
    .send { border: 0; background: var(--sun); color: #143047; font-weight: 700; border-radius: 12px; padding: 0 16px; cursor: pointer; }
    .textish { border-radius: 12px; }
    .drawer { position: fixed; top: 0; right: 0; width: min(340px, 100%); height: 100%; background: white; border-left: 1px solid var(--line); padding: 18px; transform: translateX(100%); transition: transform 0.2s ease; }
    .drawer.open { transform: translateX(0); }
    .drawer pre { white-space: pre-wrap; background: #f4f9fc; border-radius: 12px; padding: 12px; font-size: 12px; }
    @media (max-width: 800px) {
      .workspace, .places, .days { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="review">
    <div><b>历史快照 v0.4</b>（截至 2026-10-20，当前见 v0.5）· 布局与 v0.2 相同。演示数据，不连接模型和地图。</div>
    <div class="states" role="group" aria-label="切换状态">
      <button type="button" data-state="empty" aria-pressed="true">空</button>
      <button type="button" data-state="loading" aria-pressed="false">加载</button>
      <button type="button" data-state="ok" aria-pressed="false">正常</button>
      <button type="button" data-state="fail" aria-pressed="false">失败</button>
    </div>
  </div>
  <main class="app">
    <header class="top">
      <div>
        <h1>旅游助手</h1>
        <p>这次出行的城市、天数和安排都在这一页。</p>
      </div>
      <button class="textish" id="dev" type="button">开发者</button>
    </header>
    <div class="workspace">
      <aside class="side">
        <h2>这次行程</h2>
        <strong id="city">还没定</strong>
        <div class="facts" id="facts"></div>
        <span id="source">说一个城市就能开始。</span>
      </aside>
      <section class="main" id="sheet"></section>
    </div>
    <form class="dock" id="form">
      <input id="input" aria-label="出行需求" placeholder="成都两天，轻松一点" />
      <button class="textish" id="clear" type="button">清空</button>
      <button class="send" type="submit">发送</button>
    </form>
  </main>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <h2>开发者</h2>
    <p>日志不占主界面。这里是演示。</p>
    <pre id="log">（本次尚无日志）</pre>
    <button class="textish" id="close-dev" type="button">关闭</button>
  </aside>
  <script>
    const sheet = document.getElementById("sheet");
    const city = document.getElementById("city");
    const facts = document.getElementById("facts");
    const source = document.getElementById("source");
    const input = document.getElementById("input");
    const log = document.getElementById("log");
    const drawer = document.getElementById("drawer");
    const views = {
      empty: {
        city: "还没定", facts: [], source: "说一个城市就能开始。",
        placeholder: "成都两天，轻松一点", log: "（本次尚无日志）",
        html: `<div class="places">
          <button class="place cd" type="button" data-fill="成都两天，轻松不赶，帮我简单安排"><b>成都</b><span>两天 · 熊猫和老城，不赶路</span></button>
          <button class="place hz" type="button" data-fill="杭州周末，西湖附近走走"><b>杭州</b><span>周末 · 西湖边走走</span></button>
          <button class="place bj" type="button" data-fill="北京三天，别太赶"><b>北京</b><span>三天 · 城里的经典线路</span></button>
        </div>`
      },
      loading: {
        city: "成都", facts: ["两天", "轻松不赶"], source: "本句指定",
        placeholder: "成都两天，轻松一点", log: "正在查询高德…",
        html: `<p class="ask">你说：<b>成都两天，轻松不赶，帮我简单安排</b></p><p>正在查地点和天气。</p><div class="bar"></div><div class="bar"></div><div class="bar short"></div>`
      },
      ok: {
        city: "成都", facts: ["三天", "轻松不赶"], source: "沿用上一轮，天数已改成三天",
        placeholder: "接着改，比如换成丽江", log: "maps_text_search city=成都\nmaps_weather city=成都",
        html: `<p class="ask">你说：<b>改成三天</b></p>
          <div class="weather"><span>多云到阴 · 18–26℃</span><span>演示数据</span></div>
          <div class="days">
            <article class="day d1"><small>第 1 天</small><h3>熊猫和老城</h3><p>上午看熊猫基地，下午在宽窄巷子慢慢走。</p></article>
            <article class="day d2"><small>第 2 天</small><h3>市区慢慢逛</h3><p>人民公园喝茶，顺路吃一家火锅。</p></article>
            <article class="day d3"><small>第 3 天</small><h3>近郊半天</h3><p>上午出城，下午留在市区。</p></article>
          </div>
          <details><summary>查看依据</summary><p>思考过程默认收起，不展示工具原文。</p></details>`
      },
      fail: {
        city: "成都", facts: ["三天", "轻松不赶"], source: "上一轮仍是成都；这一句没查到丽江",
        placeholder: "成都两天，轻松一点", log: "maps_weather 失败：额度超限",
        html: `<p class="ask">你说：<b>丽江今天天气</b></p><div class="fail"><h3>这次没查到</h3><p>高德没有返回丽江的天气。左边的成都行程还在，对话也没有被清空。</p></div>`
      }
    };
    function render(name) {
      const view = views[name];
      city.textContent = view.city;
      facts.innerHTML = view.facts.map((item) => `<i>${item}</i>`).join("");
      source.textContent = view.source;
      input.placeholder = view.placeholder;
      log.textContent = view.log;
      sheet.innerHTML = view.html;
      document.querySelectorAll(".states button").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.state === name));
      });
      sheet.querySelectorAll("[data-fill]").forEach((button) => {
        button.addEventListener("click", () => { input.value = button.dataset.fill; input.focus(); });
      });
    }
    document.querySelectorAll(".states button").forEach((button) => {
      button.addEventListener("click", () => render(button.dataset.state));
    });
    function setDrawer(open) {
      drawer.classList.toggle("open", open);
      drawer.setAttribute("aria-hidden", String(!open));
    }
    document.getElementById("dev").addEventListener("click", () => setDrawer(true));
    document.getElementById("close-dev").addEventListener("click", () => setDrawer(false));
    document.getElementById("clear").addEventListener("click", () => { input.value = ""; render("empty"); });
    document.getElementById("form").addEventListener("submit", (event) => {
      event.preventDefault();
      input.placeholder = "原型不会真的发送。请用顶部状态切换看加载、正常和失败。";
    });
    render("empty");
  </script>
</body>
</html>
